<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-label="Yumin's GitHub Stats">
  <title>Yumin's GitHub Stats</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1033"/>
      <stop offset="1" stop-color="#2f1450"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#9d6bff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="238" rx="16" fill="url(#bg)" stroke="#ff7ad9" stroke-opacity="0.45" stroke-width="2"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="28" y="44" font-size="20" font-weight="700" fill="#ff7ad9">Yumin's GitHub Stats</text>
    <circle cx="34" cy="79" r="4" fill="#ff7ad9"/>
    <text x="48" y="84" font-size="15" fill="#e9d5ff">Public Repositories</text>
    <text x="448" y="84" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">3</text>
    <circle cx="34" cy="109" r="4" fill="#ff7ad9"/>
    <text x="48" y="114" font-size="15" fill="#e9d5ff">Commits (last year)</text>
    <text x="448" y="114" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">17</text>
    <circle cx="34" cy="139" r="4" fill="#ff7ad9"/>
    <text x="48" y="144" font-size="15" fill="#e9d5ff">Pull Requests</text>
    <text x="448" y="144" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">0</text>
    <circle cx="34" cy="169" r="4" fill="#ff7ad9"/>
    <text x="48" y="174" font-size="15" fill="#e9d5ff">Active Days (last year)</text>
    <text x="448" y="174" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">12</text>
    <circle cx="34" cy="199" r="4" fill="#ff7ad9"/>
    <text x="48" y="204" font-size="15" fill="#e9d5ff">Contributions (last year)</text>
    <text x="448" y="204" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">21</text>
  </g>
</svg>
