<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1033"/>
      <stop offset="1" stop-color="#2f1450"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#9d6bff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="238" rx="16" fill="url(#bg)" stroke="#ff7ad9" stroke-opacity="0.45" stroke-width="2"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="28" y="44" font-size="20" font-weight="700" fill="#ff7ad9">Most Used Languages</text>
    <clipPath id="barclip"><rect x="28" y="66" width="424.0" height="20" rx="10"/></clipPath>
    <g clip-path="url(#barclip)">
      <rect x="28.0" y="66" width="301.9" height="20" fill="#DA5B0B"/>
      <rect x="329.9" y="66" width="122.1" height="20" fill="#3572A5"/>
    </g>
    <circle cx="34" cy="121" r="6" fill="#DA5B0B"/>
    <text x="48" y="126" font-size="14" fill="#e9d5ff">Jupyter Notebook 71.2%</text>
    <circle cx="249" cy="121" r="6" fill="#3572A5"/>
    <text x="263" y="126" font-size="14" fill="#e9d5ff">Python 28.8%</text>
    <text x="28" y="214" font-size="11" fill="#c4b5fd">by code size, public repositories only</text>
  </g>
</svg>
