<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Welcome to Yumin's GitHub">
  <title>Welcome to Yumin's GitHub</title>
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#ff3fa4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d6bff"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <g id="spark">
      <path d="M0 -16 C 2 -5, 5 -2, 16 0 C 5 2, 2 5, 0 16 C -2 5, -5 2, -16 0 C -5 -2, -2 -5, 0 -16 Z"/>
    </g>
  </defs>

  <g font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif" text-anchor="middle" stroke-linejoin="round" stroke-linecap="round">
    <!-- line 1 -->
    <text x="500" y="112" font-size="68" fill="url(#pink)" stroke="#6d28d9" stroke-width="14" paint-order="stroke">Welcome to</text>
    <text x="500" y="112" font-size="68" fill="url(#pink)" stroke="#fde047" stroke-width="7" paint-order="stroke">Welcome to</text>
    <!-- line 2 -->
    <text x="500" y="206" font-size="88" fill="url(#violet)" stroke="#ff3fa4" stroke-width="16" paint-order="stroke">Yumin's GitHub</text>
    <text x="500" y="206" font-size="88" fill="url(#violet)" stroke="#fde047" stroke-width="8" paint-order="stroke">Yumin's GitHub</text>
  </g>

  <text x="500" y="262" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#ff5cc8">DATA ANALYST PORTFOLIO</text>

  <!-- twinkling sparkles -->
  <g fill="#fde047">
    <use href="#spark" transform="translate(120 70) scale(1.1)"><animateTransform attributeName="transform" type="scale" additive="sum" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(880 60) scale(0.9)"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(70 200) scale(0.7)"><animateTransform attributeName="transform" type="scale" additive="sum" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(930 215) scale(1)"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></use>
  </g>
  <g fill="#ff7ad9">
    <use href="#spark" transform="translate(190 240) scale(0.55)"><animateTransform attributeName="transform" type="scale" additive="sum" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(815 250) scale(0.6)"><animateTransform attributeName="transform" type="scale" additive="sum" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/></use>
  </g>
</svg>
