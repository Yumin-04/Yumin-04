<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Yumin Lee, Data Analyst Portfolio">
  <title>Yumin Lee | Data Analyst Portfolio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#16306b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>

    <!-- bar chart (right) -->
    <g transform="translate(610 40)">
      <rect x="0"   y="120" width="26" height="80"  rx="4" fill="url(#bar)"><animate attributeName="height" values="0;80;80" dur="1.4s" fill="freeze"/><animate attributeName="y" values="200;120;120" dur="1.4s" fill="freeze"/></rect>
      <rect x="42"  y="90"  width="26" height="110" rx="4" fill="url(#bar)"><animate attributeName="height" values="0;110;110" dur="1.6s" fill="freeze"/><animate attributeName="y" values="200;90;90" dur="1.6s" fill="freeze"/></rect>
      <rect x="84"  y="105" width="26" height="95"  rx="4" fill="url(#bar)"><animate attributeName="height" values="0;95;95" dur="1.8s" fill="freeze"/><animate attributeName="y" values="200;105;105" dur="1.8s" fill="freeze"/></rect>
      <rect x="126" y="60"  width="26" height="140" rx="4" fill="url(#bar)"><animate attributeName="height" values="0;140;140" dur="2s" fill="freeze"/><animate attributeName="y" values="200;60;60" dur="2s" fill="freeze"/></rect>
      <rect x="168" y="40"  width="26" height="160" rx="4" fill="url(#bar)"><animate attributeName="height" values="0;160;160" dur="2.2s" fill="freeze"/><animate attributeName="y" values="200;40;40" dur="2.2s" fill="freeze"/></rect>
      <rect x="210" y="70"  width="26" height="130" rx="4" fill="url(#bar)"><animate attributeName="height" values="0;130;130" dur="2.4s" fill="freeze"/><animate attributeName="y" values="200;70;70" dur="2.4s" fill="freeze"/></rect>
      <rect x="252" y="25"  width="26" height="175" rx="4" fill="url(#bar)"><animate attributeName="height" values="0;175;175" dur="2.6s" fill="freeze"/><animate attributeName="y" values="200;25;25" dur="2.6s" fill="freeze"/></rect>
    </g>

    <!-- trend line over the bars -->
    <polyline points="623,150 665,118 707,128 749,82 791,64 833,96 875,48"
              fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="520" stroke-dashoffset="520">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="2.4s" begin="0.3s" fill="freeze"/>
    </polyline>
    <g fill="#ffffff" stroke="#38bdf8" stroke-width="2">
      <circle cx="623" cy="150" r="4.5"/><circle cx="665" cy="118" r="4.5"/><circle cx="707" cy="128" r="4.5"/>
      <circle cx="749" cy="82" r="4.5"/><circle cx="791" cy="64" r="4.5"/><circle cx="833" cy="96" r="4.5"/>
      <circle cx="875" cy="48" r="5.5" stroke="#34d399"/>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#ffffff">
      <text x="56" y="108" font-size="22" font-weight="600" fill="#7dd3fc" letter-spacing="3">DATA ANALYST PORTFOLIO</text>
      <text x="54" y="178" font-size="76" font-weight="800" letter-spacing="-1">Yumin Lee</text>
      <text x="56" y="222" font-size="22" fill="#e2e8f0" fill-opacity="0.92">Turning messy data into trustworthy analysis</text>
      <text x="56" y="252" font-size="16" fill="#94a3b8" letter-spacing="1">Data Science  ·  Smart Factory  ·  Simulation</text>
    </g>

    <!-- animated wave -->
    <g opacity="0.18" fill="#ffffff">
      <path d="M0 250 C 150 220, 300 280, 450 250 S 750 220, 900 250 S 1100 270, 1200 250 L1200 280 L0 280 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-200 0;0 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.10" fill="#ffffff">
      <path d="M0 262 C 200 240, 350 285, 500 262 S 800 240, 950 262 S 1150 280, 1250 262 L1250 280 L0 280 Z">
        <animateTransform attributeName="transform" type="translate" values="-150 0;0 0;-150 0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
